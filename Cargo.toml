[package]
name = "excelerate"
version = "0.15.0"
edition = "2024"
rust-version = "1.92"
description = "Read, write and recalculate spreadsheets: xlsx, xls, ods, csv, html, and a 518-function formula engine"
license = "MIT"
repository = "https://github.com/rosperitus/excelerate"
homepage = "https://github.com/rosperitus/excelerate"
documentation = "https://docs.rs/excelerate"
readme = "README.md"
keywords = ["xlsx", "spreadsheet", "excel", "ods", "formula"]
categories = ["parser-implementations", "encoding", "wasm"]
# The npm packages are built from this crate but are not part of it, and the
# oracle is a Go module used to check our answers against another engine.
exclude = ["npm/", "npm-reader/", "tools/", ".github/", "build-npm.sh", "build-npm-reader.sh", "pack-npm.sh"]

[features]
default = ["formulas", "write"]
# The formula engine: parser, evaluator and the builtins. The bulk of the
# crate by volume, and what a reader-only build drops first.
formulas = ["dep:regex"]
# Writing files back out, in every format that has a writer.
write = []

[dependencies]
# The cipher of a workbook encrypted with a password to open
# (`reader::encryption`). Pure Rust.
aes = "0.9"
# The Deflate of `zip`, named here so the Gnumeric reader can gunzip its one
# XML part too.
flate2 = "1.1.9"
# With `sha1` and `sha2`: the password hash of a protected sheet or workbook
# (SHA-512, SHA-1 for older files) and its random salt.
getrandom = "0.4"
quick-xml = "0.42.0"
# `REGEXTEST`, `REGEXEXTRACT`, `REGEXREPLACE`: a pattern engine is not twenty
# lines. Without lookaround or backreferences, which Excel's PCRE2 has. The
# speed-ups and the Unicode tables beyond `\w`, `\d`, `\s` and case are left
# out: with them the wasm grew by 1.1 MB.
regex = { version = "1", optional = true, default-features = false, features = [
    "std",
    "unicode-case",
    "unicode-perl",
] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2.0.20"
# Only Stored and Deflate: every package format read or written here uses
# nothing else. The defaults add zstd, bzip2, lzma, ppmd, deflate64, zopfli
# and zip's own encryption; zstd is C (`zstd-sys`), so a wasm build needed
# clang. Deflate stays on zlib-rs, the backend the defaults chose.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The wasm bindings only; a native build never sees this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Date.now()`: wasm32-unknown-unknown has no clock of its own.
js-sys = "0.3"
# `crypto.getRandomValues` for the salt of a new password hash.
getrandom = { version = "0.4", features = ["wasm_js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# lint-clippy-nursery-selected: the starter set, not the whole group.
redundant_clone = "warn"
use_self = "warn"
or_fun_call = "warn"
significant_drop_tightening = "warn"
needless_collect = "warn"
unused_peekable = "warn"
unnecessary_struct_initialization = "warn"
branches_sharing_code = "warn"
needless_pass_by_ref_mut = "warn"
derive_partial_eq_without_eq = "warn"
